name: labs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  labs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install pinned packages
        run: pip install -r requirements.txt
      - name: Every lab in Python and in R, and the two must agree
        run: make labs
      - name: The world's own cross-check in Python and in R
        run: make crosscheck
